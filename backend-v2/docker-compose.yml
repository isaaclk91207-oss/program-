services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pccp
      POSTGRES_USER: pccp
      POSTGRES_PASSWORD: pccp_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pccp -d pccp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
