<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<!-- Google Fonts -->

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-canvas text-on-surface font-body-base antialiased min-h-screen flex flex-col">
<!-- TopAppBar Shared Component -->
<header class="flex justify-between items-center w-full px-margin-mobile h-12 bg-surface border-b border-hairline fixed top-0 z-50 transition-all duration-200">
<div class="flex items-center gap-md">
<button aria-label="Menu" class="material-symbols-outlined text-primary hover:bg-surface-container-low p-1 rounded transition-colors">menu</button>
<span class="font-display-lg text-display-lg font-extrabold text-primary tracking-tight" style="font-size: 20px; line-height: 24px;">PCCP Transport</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-hairline overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto pt-[64px] pb-[80px] px-margin-mobile flex flex-col gap-lg"><!-- CURRENT Section -->
<section class="flex flex-col gap-md">
<div class="flex items-center justify-between px-1">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Current</h3>
</div>
<div class="bg-surface-container-lowest border border-role-driver/30 rounded-xl p-base shadow-sm relative overflow-hidden">
<div class="absolute left-0 top-0 w-1 h-full bg-role-driver"></div>
<div class="flex justify-between items-start mb-md pl-2">
<div class="flex flex-col gap-1">
<span class="inline-block px-2 py-1 bg-role-driver-container text-role-driver font-label-caps text-label-caps rounded-full w-max tracking-wider">IN PROGRESS</span>
<h2 class="font-title-lg text-title-lg text-on-surface mt-1">PCCP-TR-2026-0001</h2>
</div>
<div class="flex flex-col items-end">
<span class="font-title-md text-title-md text-on-surface">08:30 AM</span>
</div>
</div>
<div class="flex flex-col gap-sm mb-lg pl-2">
<div class="flex items-center gap-sm text-on-surface">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">route</span>
<span class="font-body-base">uab HO → Airport</span>
</div>
<div class="flex items-center gap-sm text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 20px;">group</span>
<span class="font-body-sm">2 passengers</span>
</div>
</div>
<button class="w-full h-[48px] bg-role-driver text-white rounded-lg font-title-md text-title-md flex justify-center items-center gap-xs hover:opacity-90 active:scale-[0.98] transition-all">
            Open Assignment
        </button>
</div>
</section>
<!-- UPCOMING Section -->
<section class="flex flex-col gap-md">
<div class="flex items-center justify-between px-1">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Upcoming</h3>
</div>
<div class="bg-surface-container-lowest border border-hairline rounded-xl p-md shadow-sm flex flex-col gap-sm hover:border-outline-variant transition-colors cursor-pointer">
<div class="flex justify-between items-center">
<span class="px-2 py-1 bg-surface-container text-on-surface-variant font-label-caps text-label-caps rounded-full tracking-wider">UPCOMING</span>
<span class="font-title-md text-title-md text-on-surface">02:00 PM</span>
</div>
<div>
<span class="font-title-md text-title-md text-on-surface">PCCP-TR-2026-0002</span>
</div>
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 18px;">near_me</span>
<span class="font-body-sm truncate">uab HO → Sule Square</span>
</div>
</div>
</section>
<!-- COMPLETED Section -->
<section class="flex flex-col gap-md">
<div class="flex items-center justify-between px-1">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Completed</h3>
</div>
<div class="bg-surface-container-low border border-hairline rounded-xl p-md flex flex-col gap-sm opacity-80">
<div class="flex justify-between items-center">
<span class="px-2 py-1 bg-role-admin-container text-role-admin font-label-caps text-label-caps rounded-full tracking-wider">COMPLETED</span>
<span class="font-title-md text-title-md text-on-surface-variant">07:00 AM</span>
</div>
<div>
<span class="font-title-md text-title-md text-on-surface-variant">PCCP-TR-2026-0000</span>
</div>
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span>
<span class="font-body-sm truncate">uab HO → Downtown</span>
</div>
</div>
</section></main>
<!-- BottomNavBar Shared Component -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface border-t border-hairline shadow-md flex justify-around items-center h-[64px] pb-safe md:hidden transition-transform duration-150">
<!-- Active Tab: Trips (Mapped to 'Assignments' in Driver Context) -->
<button class="flex flex-col items-center justify-center bg-role-passenger-container text-on-primary-container rounded-xl px-3 py-1 scale-95 transition-transform duration-150 group">
<span class="material-symbols-outlined text-role-passenger" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
<span class="font-body-sm text-body-sm mt-1 text-role-passenger font-medium">Assignments</span>
</button>
<!-- Inactive Tab: Requests -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 scale-95 active:scale-90 transition-transform duration-150 hover:bg-surface-container-high rounded-xl">
<span class="material-symbols-outlined">add_location_alt</span>
<span class="font-body-sm text-body-sm mt-1">Requests</span>
</button>
<!-- Inactive Tab: Performance -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 scale-95 active:scale-90 transition-transform duration-150 hover:bg-surface-container-high rounded-xl">
<span class="material-symbols-outlined">speed</span>
<span class="font-body-sm text-body-sm mt-1">Performance</span>
</button>
<!-- Inactive Tab: Account -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 scale-95 active:scale-90 transition-transform duration-150 hover:bg-surface-container-high rounded-xl">
<span class="material-symbols-outlined">person</span>
<span class="font-body-sm text-body-sm mt-1">Account</span>
</button>
</nav>
</body></html>
