<body class="bg-surface-canvas text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-14 w-full">
<button class="text-role-driver dark:text-role-driver-container hover:bg-surface-container-low transition-colors active:opacity-80 transition-opacity p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-role-driver dark:text-role-driver-container">
            Driver Portal
        </h1>
<button class="text-role-driver dark:text-role-driver-container hover:bg-surface-container-low transition-colors active:opacity-80 transition-opacity p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow pt-[72px] pb-[88px] px-margin-mobile md:px-margin-desktop w-full max-w-3xl mx-auto flex flex-col items-center justify-center space-y-xl">
<!-- Status Badge -->
<div class="bg-role-admin-container text-role-admin font-label-caps text-label-caps px-md py-xs rounded-full uppercase tracking-wider inline-flex items-center space-x-xs">
<span class="material-symbols-outlined text-[14px]" data-icon="check_circle">check_circle</span>
<span>COMPLETED</span>
</div>
<!-- Central Checkmark -->
<div class="relative w-32 h-32 flex items-center justify-center">
<div class="absolute inset-0 bg-role-driver-container rounded-full opacity-50 animate-ping"></div>
<div class="absolute inset-2 bg-role-driver-container rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-role-driver fill text-[72px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Headline -->
<div class="text-center space-y-sm">
<h2 class="font-display-lg text-display-lg text-on-surface">Trip Completed</h2>
<p class="font-body-base text-body-base text-on-surface-variant max-w-md mx-auto">
                Excellent work. The passenger has been dropped off securely. Your trip log has been updated.
            </p>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-md pt-xl">
<button class="w-full h-12 flex items-center justify-center space-x-sm border-[1.5px] border-border-hairline bg-surface-container-lowest text-on-surface font-title-md text-title-md rounded-lg shadow-sm hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span>View Trip Summary</span>
</button>
<button class="w-full h-12 flex items-center justify-center space-x-sm border-[1.5px] border-border-hairline bg-surface-container-lowest text-on-surface font-title-md text-title-md rounded-lg shadow-sm hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="star_rate">star_rate</span>
<span>Passenger Assessment Received</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe md:hidden bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline shadow-sm flex justify-around items-center w-full h-16 px-2">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-3 py-1.5 hover:text-role-driver dark:hover:text-role-driver-container scale-95 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>

<span class="material-symbols-outlined" data-icon="query_stats">query_stats</span>

</a>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-3 py-1.5 hover:text-role-driver dark:hover:text-role-driver-container scale-95 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps mt-1">Account</span>
</a>
