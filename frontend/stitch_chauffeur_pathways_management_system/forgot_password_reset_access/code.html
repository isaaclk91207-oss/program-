<p class="font-body-base text-body-base text-on-surface-variant">Enter your email or employee ID below to receive password reset instructions.</p>
</div>

<form action="#" class="flex flex-col gap-lg" method="POST">

<div class="flex flex-col gap-xs">
<label class="font-title-md text-title-md text-on-surface" for="identifier">Email or Employee ID</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline-variant pointer-events-none filled-icon" data-icon="mail" data-weight="fill">mail</span>
<input class="w-full h-[48px] pl-10 pr-md bg-surface-canvas border border-outline-variant rounded-lg text-on-surface placeholder:text-outline-variant focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-base" id="identifier" name="identifier" placeholder="Enter your email or ID" required="" type="text"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-title-md text-title-md rounded-lg hover:bg-primary-container transition-colors flex items-center justify-center gap-sm active:scale-[0.98]" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>

<div class="text-center mt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
