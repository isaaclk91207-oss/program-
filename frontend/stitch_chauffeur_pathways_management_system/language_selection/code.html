<style>
        .custom-radio {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid theme('colors.outline');
            border-radius: 50%;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
        }

        .custom-radio::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em theme('colors.primary');
            background-color: theme('colors.primary');
        }

        .custom-radio:checked {
            border-color: theme('colors.primary');
        }

        .custom-radio:checked::before {
            transform: scale(1);
        }
        
        .radio-container:focus-within .custom-radio {
            outline: max(2px, 0.15em) solid theme('colors.primary-fixed');
            outline-offset: max(2px, 0.15em);
        }
    </style>

<body class="bg-surface-canvas min-h-screen flex flex-col font-body-base text-on-surface">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-primary border-b border-primary-container shadow-sm flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full transition-colors">

<button aria-label="Go back" class="text-on-primary hover:bg-white/10 p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary">Language</h1>
</div>

</header>
<!-- Main Content -->
<main class="flex-1 mt-16 p-margin-mobile md:p-margin-desktop flex flex-col items-center">
<div class="w-full max-w-[440px] flex flex-col gap-6 w-full">
<!-- Language List Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-border-hairline overflow-hidden">
<!-- English Option -->
<label class="radio-container flex items-center justify-between p-base border-b border-border-hairline cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">language</span>
<div>
<div class="font-title-md text-title-md text-on-surface">English</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">Default</div>
</div>
</div>
<input checked="" class="custom-radio" name="language_selection" type="radio" value="en">
</label>
<!-- Myanmar Option -->
<label class="radio-container flex items-center justify-between p-base cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">translate</span>
<div>
<div class="font-title-md text-title-md text-on-surface">Myanmar (မြန်မာဘာသာ)</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">Burmese</div>
</div>
</div>
<input class="custom-radio" name="language_selection" type="radio" value="my">
</label>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-4">
                Selecting a new language will apply changes across the entire PCCP application instantly.
            </p>
</div>
