<body class="bg-surface-canvas min-h-screen text-on-surface font-body-base antialiased flex flex-col pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-bright border-b border-border-hairline shadow-sm flex items-center justify-between h-16 transition-all">
<div class="flex items-center gap-4 flex-1 px-margin-mobile md:px-margin-desktop h-16">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container transition-colors active:scale-95 flex items-center justify-center group flex-shrink-0 bg-primary-container text-on-primary">
<span class="material-symbols-outlined text-2xl group-hover:text-primary transition-colors">arrow_back</span>
</button>

<h1 class="font-title-lg text-title-lg font-bold text-primary tracking-tight">New Request</h1>
</div>

</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start p-margin-mobile md:p-margin-desktop w-full max-w-[440px] mx-auto">
<!-- Progress Indicator -->
<div class="w-full mb-xl"><div class="flex justify-between items-center mb-2">
<span class="font-title-md text-title-md text-on-surface font-bold">Step 1 of 3</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Basic Info</span>
</div>
<div class="flex gap-2 w-full h-2">
<div class="h-full rounded-full flex-1 bg-primary-container"></div>
<div class="h-full rounded-full flex-1 bg-surface-container-low"></div>
<div class="h-full rounded-full flex-1 bg-surface-container-low"></div>
</div></div>
<!-- Form Card -->
<div class="bg-surface-container-lowest border border-border-hairline shadow-[0px_1px_3px_rgba(15,23,42,0.05)] rounded-xl p-xl w-full flex flex-col gap-lg">
<!-- Requester Name -->
<div class="flex flex-col gap-xs">
<label class="font-title-md text-title-md text-on-surface" for="requester-name">Requester Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-canvas border-none rounded-lg font-body-base text-on-surface focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" id="requester-name" readonly="" type="text" value="Shoon">
</div>
</div>
<!-- Department -->
<div class="flex flex-col gap-xs">
<label class="font-title-md text-title-md text-on-surface" for="department">Department</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant z-10">domain</span>
<select class="w-full pl-10 pr-4 py-3 bg-surface-canvas border-none rounded-lg font-body-base text-on-surface focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all appearance-none" id="department">
<option selected="" value="SME Department">SME Department</option>
<option value="HR Department">HR Department</option>
<option value="IT Department">IT Department</option>
<option value="Finance">Finance</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 transform -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Request Date -->
<div class="flex flex-col gap-xs">
<label class="font-title-md text-title-md text-on-surface" for="request-date">Request Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant">calendar_today</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-canvas border border-border-hairline rounded-lg font-body-base text-on-surface focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" id="request-date" type="date">
</div>
</div>
<!-- Purpose of Trip -->
<div class="flex flex-col gap-xs">
<label class="font-title-md text-title-md text-on-surface" for="purpose">Purpose of Trip</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-outline-variant">description</span>
<textarea class="w-full pl-10 pr-4 py-3 bg-surface-canvas border border-border-hairline rounded-lg font-body-base text-on-surface focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all resize-none" id="purpose" placeholder="Briefly describe the purpose..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Next Button -->
<div class="w-full mt-2xl pb-xl">
<button class="w-full h-12 text-on-primary rounded-lg font-title-lg text-title-lg flex items-center justify-center gap-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-sm bg-primary-container">
                Next Step
                <span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Set today's date as default for the date picker
        document.getElementById('request-date').valueAsDate = new Date();
    </script>


<div id="snapdom-sandbox" data-snapdom-sandbox="true" aria-hidden="true" style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div></body></html>
