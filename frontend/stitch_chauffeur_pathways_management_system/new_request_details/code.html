<!-- Request Date Picker -->

<option value="sec2">Section 2</option>

<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-hairline p-margin-mobile shadow-[0px_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 md:static md:shadow-none md:bg-transparent md:border-none md:px-margin-desktop md:pt-0">

<button class="flex-1 md:flex-none px-xl h-[48px] border-[1.5px] border-outline-variant text-on-surface font-title-md text-title-md rounded-lg hover:bg-surface-container-low transition-colors" type="button">
                Cancel
            </button>

                Next Step
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

<!-- Scripts for interactivity -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Auto-calc month based on date selection
            const dateInput = document.getElementById('requestDate');
            const monthText = document.getElementById('monthCalcText');
            
            dateInput.addEventListener('change', (e) => {
                if(e.target.value) {
                    const date = new Date(e.target.value);
                    const monthNames = ["January", "February", "March", "April", "May", "June",
                        "July", "August", "September", "October", "November", "December"
                    ];
                    monthText.textContent = `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
                    monthText.classList.remove('text-on-surface-variant');
                    monthText.classList.add('text-on-surface', 'font-medium');
                } else {
                    monthText.textContent = '--';
                    monthText.classList.add('text-on-surface-variant');
                    monthText.classList.remove('text-on-surface', 'font-medium');
                }
            });

            // Passenger Chips Logic
            const input = document.getElementById('newPassengerInput');
            const btn = document.getElementById('addPassengerBtn');
            const container = document.getElementById('passengerChipsContainer');
            const countDisplay = document.getElementById('passengerCountDisplay');
            
            let passengers = [];

            function updateCount() {
                // 1 (requester) + additional
                countDisplay.textContent = 1 + passengers.length;
            }

            function renderChips() {
                container.innerHTML = '';
                passengers.forEach((p, index) => {
                    const chip = document.createElement('div');
                    chip.className = 'flex items-center gap-xs px-sm py-xs bg-surface-container border border-outline-variant rounded-full font-body-sm text-body-sm text-on-surface';
                    chip.innerHTML = `
                        <span class="material-symbols-outlined text-[16px] text-on-surface-variant">person</span>
                        ${p}
                        <button type="button" class="flex items-center justify-center w-6 h-6 rounded-full hover:bg-surface-variant text-on-surface-variant hover:text-error transition-colors" data-index="${index}">
                            <span class="material-symbols-outlined text-[16px] pointer-events-none">close</span>
                        </button>
                    `;
                    container.appendChild(chip);
                });
                updateCount();
            }

            function addPassenger() {
                const val = input.value.trim();
                if(val) {
                    passengers.push(val);
                    input.value = '';
                    renderChips();
                }
            }

            btn.addEventListener('click', addPassenger);
            input.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    e.preventDefault();
                    addPassenger();
                }
            });

            container.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if(btn) {
                    const index = btn.getAttribute('data-index');
                    passengers.splice(index, 1);
                    renderChips();
                }
            });
        });
    </script>
