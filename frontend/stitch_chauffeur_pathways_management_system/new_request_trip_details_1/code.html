            "borderRadius": {

<style>
        body { background-color: #F8FAFC; }
        .service-card input:checked + div {
            border-color: #0369a1;
            background-color: #f0f9ff;
            box-shadow: 0 0 0 1px #0369a1;
        }
        .service-card input:checked + div .icon-container {
            color: #0369a1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface font-body-base antialiased bg-surface-canvas min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface-container-highest flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 border-b border-outline-variant flat no shadows fixed top-0 w-full z-40">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors" onclick="window.location.href='{{DATA:SCREEN:SCREEN_60}}'">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="text-title-lg font-title-lg font-extrabold text-primary">PCCP Transport</div>
</div>
<div>
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary">close</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Transactional intent, suppressed nav shell) -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile md:px-margin-desktop max-w-4xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="mb-2xl">
<div class="flex justify-between items-center mb-sm">
<span class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Step 2 of 3</span>
<span class="text-label-caps font-label-caps text-primary uppercase tracking-wider">Trip Details</span>
</div>
<div class="flex gap-xs w-full h-2">
<div class="flex-1 rounded-full bg-primary-container"></div>
<div class="flex-1 rounded-full bg-primary-container"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-xl">Trip Details</h1>
<form class="space-y-2xl">
<!-- Type of Service -->
<section class="bg-white border border-border-hairline rounded-xl p-base md:p-xl shadow-sm">
<h2 class="text-title-md font-title-md text-on-surface mb-base pb-sm border-b border-border-hairline">Type of Service</h2>
<div class="grid grid-cols-2 md:grid-cols-5 gap-md">
<!-- One Way -->
<label class="service-card cursor-pointer relative">
<input checked="" class="sr-only" name="service_type" type="radio" value="one_way">
<div class="h-full border border-border-hairline rounded-lg p-md flex flex-col items-center justify-center text-center hover:border-outline-variant transition-colors bg-white">
<span class="material-symbols-outlined text-outline mb-sm icon-container text-2xl">arrow_right_alt</span>
<span class="text-body-sm font-body-sm font-medium">One Way</span>
</div>
</label>
<!-- Round Trip -->
<label class="service-card cursor-pointer relative">
<input class="sr-only" name="service_type" type="radio" value="round_trip">
<div class="h-full border border-border-hairline rounded-lg p-md flex flex-col items-center justify-center text-center hover:border-outline-variant transition-colors bg-white">
<span class="material-symbols-outlined text-outline mb-sm icon-container text-2xl">sync_alt</span>
<span class="text-body-sm font-body-sm font-medium">Round Trip</span>
</div>
</label>
<!-- Overnight -->
<label class="service-card cursor-pointer relative">
<input class="sr-only" name="service_type" type="radio" value="overnight">
<div class="h-full border border-border-hairline rounded-lg p-md flex flex-col items-center justify-center text-center hover:border-outline-variant transition-colors bg-white">
<span class="material-symbols-outlined text-outline mb-sm icon-container text-2xl">bedtime</span>
<span class="text-body-sm font-body-sm font-medium">Overnight</span>
</div>
</label>
<!-- Multi-Stop -->
<label class="service-card cursor-pointer relative">
<input class="sr-only" name="service_type" type="radio" value="multi_stop">
<div class="h-full border border-border-hairline rounded-lg p-md flex flex-col items-center justify-center text-center hover:border-outline-variant transition-colors bg-white">
<span class="material-symbols-outlined text-outline mb-sm icon-container text-2xl">route</span>
<span class="text-body-sm font-body-sm font-medium">Multi-Stop</span>
</div>
</label>
<!-- Multi-Stop + Return -->
<label class="service-card cursor-pointer relative col-span-2 md:col-span-1">
<input class="sr-only" name="service_type" type="radio" value="multi_stop_return">
<div class="h-full border border-border-hairline rounded-lg p-md flex flex-col items-center justify-center text-center hover:border-outline-variant transition-colors bg-white">
<span class="material-symbols-outlined text-outline mb-sm icon-container text-2xl">alt_route</span>
<span class="text-body-sm font-body-sm font-medium">Multi-Stop + Return</span>
</div>
</label>
</div>
</section>
<!-- Route & Timing -->
<section class="bg-white border border-border-hairline rounded-xl p-base md:p-xl shadow-sm">
<h2 class="text-title-md font-title-md text-on-surface mb-base pb-sm border-b border-border-hairline">Route &amp; Timing</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-xl gap-y-base">
<!-- Pickup Location -->
<div class="relative">
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-xs" for="pickup">Pickup Location *</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">location_on</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md text-body-base font-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:ring-opacity-50 transition-shadow focus:ring-primary-container focus:border-primary-container" id="pickup" placeholder="Enter building or address" type="text">
</div>
</div>
<!-- Destination -->
<div class="relative">
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-xs" for="destination">Destination *</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">flag</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md text-body-base font-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:ring-opacity-50 transition-shadow focus:ring-primary-container focus:border-primary-container" id="destination" placeholder="Enter building or address" type="text">
</div>
</div>
<!-- Departure Time -->
<div class="relative">
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-xs" for="departure_time">Departure Date &amp; Time *</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">calendar_today</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md text-body-base font-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:ring-opacity-50 transition-shadow focus:ring-primary-container focus:border-primary-container" id="departure_time" type="datetime-local">
</div>
</div>
<!-- Return Time -->
<div class="relative">
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-xs" for="return_time">Return Date &amp; Time (Optional)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">update</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md text-body-base font-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:ring-opacity-50 transition-shadow disabled:bg-surface-container-low disabled:text-outline focus:ring-primary-container focus:border-primary-container" disabled="" id="return_time" type="datetime-local">
</div>
<p class="text-xs text-on-surface-variant mt-1">Enable by selecting Round Trip or Multi-Stop + Return.</p>
</div>
</div>
</section>
<!-- Purpose & Details -->
<section class="bg-white border border-border-hairline rounded-xl p-base md:p-xl shadow-sm">
<h2 class="text-title-md font-title-md text-on-surface mb-base pb-sm border-b border-border-hairline">Additional Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-xl gap-y-base">
<!-- Purpose -->
<div class="col-span-1 md:col-span-2">
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-xs" for="purpose">Purpose of Travel *</label>
<select class="w-full px-3 py-2 border border-outline-variant rounded-md text-body-base font-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:ring-opacity-50 transition-shadow bg-white appearance-none" id="purpose">
<option disabled="" selected="" value="">Select travel purpose</option>
<option value="customer">Customer Appointment</option>
<option value="site_visit">Site Visit / Inspection</option>
<option value="training">Training / Seminar</option>
<option value="airport">Airport Transfer</option>
<option value="other">Other</option>
</select>
</div>
<!-- Customer/Company -->
<div class="col-span-1 md:col-span-2">
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-xs" for="company_name">Customer / Company Name</label>
<input class="w-full px-3 py-2 border border-outline-variant rounded-md text-body-base font-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:ring-opacity-50 transition-shadow focus:ring-primary-container focus:border-primary-container" id="company_name" placeholder="Enter company name if applicable" type="text">
</div>
<!-- Notes -->
<div class="col-span-1 md:col-span-2">
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-xs" for="notes">Note to Transport (Optional)</label>
<textarea class="w-full px-3 py-2 border border-outline-variant rounded-md text-body-base font-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:ring-opacity-50 transition-shadow resize-y" id="notes" placeholder="Provide any special instructions, specific pickup points, or additional stops..." rows="3"></textarea>
</div>
</div>
</section>
</form>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-white border-t border-border-hairline p-base shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
<div class="max-w-4xl mx-auto flex justify-between items-center gap-base">
<a href="{{DATA:SCREEN:SCREEN_60}}" class="px-xl py-3 border-[1.5px] border-outline-variant text-on-surface rounded-md font-title-md text-title-md hover:bg-surface-container-low transition-colors w-full md:w-auto text-center h-[48px] flex items-center justify-center">
                Back
            </a>
<a href="{{DATA:SCREEN:SCREEN_55}}" class="px-xl py-3 bg-primary-container text-white rounded-md font-title-md text-title-md hover:bg-primary transition-colors w-full md:w-auto text-center h-[48px] flex items-center justify-center shadow-sm hover:bg-primary-container">
                Continue
            </a>
</div>
</div>
<script>
        // Simple logic to toggle return time field based on service type
        document.querySelectorAll('input[name="service_type"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const returnTimeInput = document.getElementById('return_time');
                if(e.target.value === 'round_trip' || e.target.value === 'multi_stop_return') {
                    returnTimeInput.disabled = false;
                } else {
                    returnTimeInput.disabled = true;
                    returnTimeInput.value = '';
                }
            });
        });
    </script>














</body></html>
