                        Pickup Location
                    </label>
<div class="relative group">
<input class="w-full h-14 bg-slate-50 border border-[#cddfe9] rounded-xl px-4 pr-12 text-on-surface focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all placeholder:text-slate-400" placeholder="Enter pickup address" type="text" value="123 Corporate Plaza, Suite 400"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary-container" data-icon="MapPin" data-size="20px">
<span class="material-symbols-outlined">location_on</span>
</div>
</div>
</div>
<!-- Destination -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-size: 18px;">flag</span>
                        Destination

<div class="relative group">
<input class="w-full h-14 bg-slate-50 border border-[#cddfe9] rounded-xl px-4 pr-12 text-on-surface focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all placeholder:text-slate-400" placeholder="Where to?" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" data-icon="MapPin" data-size="20px">
<span class="material-symbols-outlined">map</span>
</div>
</div>
</div>
<!-- Trip Type (Segmented Buttons) -->

<div class="flex p-1 bg-slate-100 rounded-xl gap-1">
<button class="flex-1 py-2.5 px-2 rounded-lg text-sm font-medium transition-all bg-white text-primary shadow-sm ring-1 ring-black/5">One Way</button>
<button class="flex-1 py-2.5 px-2 rounded-lg text-sm font-medium transition-all text-slate-500 hover:bg-white/50">Round Trip</button>
<button class="flex-1 py-2.5 px-2 rounded-lg text-sm font-medium transition-all text-slate-500 hover:bg-white/50">Multi-Stop</button>
</div>
</div>
<!-- Pickup Time -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-size: 18px;">schedule</span>
                        Pickup Time

<div class="relative">
<input class="w-full h-14 bg-slate-50 border border-[#cddfe9] rounded-xl px-4 text-on-surface focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all" type="time" value="09:00"/>

<div>

</div>

<div class="h-4"></div>

<!-- Script for interactive elements -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.parentElement.classList.contains('bg-slate-100')) {
                    // Toggle Segmented Buttons
                    this.parentElement.querySelectorAll('button').forEach(b => {
                        b.classList.remove('bg-white', 'text-primary', 'shadow-sm', 'ring-1', 'ring-black/5');
                        b.classList.add('text-slate-500');
                    });
                    this.classList.add('bg-white', 'text-primary', 'shadow-sm', 'ring-1', 'ring-black/5');
                    this.classList.remove('text-slate-500');
                }
            });
        });
    </script>
