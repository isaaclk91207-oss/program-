<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>

<body class="bg-surface-canvas text-on-surface font-body-base min-h-screen flex flex-col pt-16 pb-20 md:pb-0 antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-bright border-b border-border-hairline shadow-sm flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 transition-all">
<div class="flex items-center gap-4 flex-1">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container transition-colors active:scale-95 flex items-center justify-center group flex-shrink-0 bg-primary-container text-on-primary">
<span class="material-symbols-outlined text-2xl group-hover:text-primary transition-colors">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary tracking-tight">New Request</h1>
</div>

</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop pt-xl pb-2xl flex flex-col gap-lg">
<!-- Header & Progress -->
<div class="flex flex-col gap-sm">
<h2 class="font-headline-lg text-headline-lg text-primary-container">Trip Info</h2>
<p class="font-body-base text-on-surface-variant">Please provide details for your journey.</p>
<div class="mb-6">
<div class="flex justify-between items-center mb-2">
<span class="font-title-md text-title-md text-on-surface">Step 2 of 3</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Review</span>
</div>
<div class="flex gap-2 w-full h-2">
<div class="h-full rounded-full flex-1 bg-primary-container"></div>
<div class="h-full rounded-full flex-1 bg-primary-container"></div>
<div class="h-full rounded-full flex-1 bg-surface-container"></div>
</div>
</div>
</div>
<!-- Form Canvas -->
<div class="bg-surface-container-lowest rounded-xl border border-border-hairline shadow-[0_1px_3px_rgba(15,23,42,0.05)] p-lg flex flex-col gap-lg relative overflow-hidden">
<!-- Decorative background blob -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<form class="flex flex-col gap-md relative z-10">
<!-- Location Inputs -->
<div class="flex flex-col gap-md relative">
<!-- Connecting line -->
<div class="absolute left-[19px] top-[30px] bottom-[30px] w-0.5 bg-border-hairline z-0">
<div class="h-full w-full bg-gradient-to-b from-border-hairline via-primary/30 to-border-hairline animate-pulse"></div>
</div>
<div class="relative z-10 group">
<label class="sr-only" for="pickup">Pickup Location</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px]" data-weight="fill">radio_button_checked</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-canvas border border-border-hairline rounded-lg font-body-base text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all focus:bg-surface-container-lowest" id="pickup" placeholder="Enter pickup location" required="" type="text" value="Corporate HQ, Building B">
</div>
<div class="relative z-10 group">
<label class="sr-only" for="destination">Destination</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px]" data-weight="fill">location_on</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-canvas border border-border-hairline rounded-lg font-body-base text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all focus:bg-surface-container-lowest" id="destination" placeholder="Enter destination" required="" type="text">
</div>
</div>
<!-- Trip Type Segmented Control -->
<div class="mt-sm">
<label class="font-title-md text-title-md text-on-surface block mb-sm">Trip Type</label>
<div class="flex bg-surface-canvas p-1 rounded-lg border border-border-hairline">
<label class="flex-1 text-center">
<input checked="" class="peer sr-only" name="tripType" type="radio" value="oneWay">
<div class="py-2 px-4 rounded-md font-title-md text-title-md text-on-surface-variant peer-checked:bg-surface-container-lowest peer-checked:text-primary peer-checked:shadow-sm cursor-pointer transition-all hover:bg-surface-container/50">
                                One Way
                            </div>
</label>
<label class="flex-1 text-center">
<input class="peer sr-only" name="tripType" type="radio" value="roundTrip">
<div class="py-2 px-4 rounded-md font-title-md text-title-md text-on-surface-variant peer-checked:bg-surface-container-lowest peer-checked:text-primary peer-checked:shadow-sm cursor-pointer transition-all hover:bg-surface-container/50">
                                Round Trip
                            </div>
</label>
<label class="flex-1 text-center">
<input class="peer sr-only" name="tripType" type="radio" value="multiStop">
<div class="py-2 px-4 rounded-md font-title-md text-title-md text-on-surface-variant peer-checked:bg-surface-container-lowest peer-checked:text-primary peer-checked:shadow-sm cursor-pointer transition-all hover:bg-surface-container/50">
                                Multi-Stop
                            </div>
</label>
</div>
</div>
<!-- Time Input -->
<div class="mt-sm">
<label class="font-title-md text-title-md text-on-surface block mb-sm">Pickup Time</label>
<div class="relative group w-full md:w-1/2">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px]">schedule</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-canvas border border-border-hairline rounded-lg font-body-base text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all focus:bg-surface-container-lowest cursor-pointer text-on-surface-variant" type="datetime-local">
</div>
</div>
</form>
</div>
<!-- Requester Context Card -->
<div class="bg-surface-container-low rounded-xl border border-surface-variant p-md flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0 overflow-hidden shadow-sm">
<img alt="Shoon avatar" class="w-full h-full object-cover" data-alt="A professional headshot of a young Asian woman with a friendly smile, wearing corporate attire against a clean, light mode background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWpRR-wz9Q9UvMg_5Ax4NBb6hlWjh1E3Wa3zPKH6to4mli4QyXHCRJEbRhylo3Q5AZnA6J4y6khJJ8w2dr9SzFlo_JQp3x53pxNf-YE8bEFo6-l_LLZzYI0yLatZ45nMUyLWSuF2L5QJcSLm2PZrP-NTslQLGDkiKotPRjFkJtyYqg82yeeiA4fCS9wnRynw4LgiXslxeZWCQEmn0d6ExgNcNWb4U1AUI2f9AFaSUo_ERi5_4uOYc">
</div>
<div>
<p class="font-title-md text-title-md text-on-surface">Shoon <span class="font-body-sm text-body-sm text-on-surface-variant font-normal px-2 py-0.5 bg-surface-variant rounded-md ml-2 inline-flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">work</span> Executive</span></p>
<p class="font-body-base text-body-base text-on-surface-variant mt-0.5">Booking for recurring executive commute.</p>
</div>
</div>
<!-- Preview Route Map -->
<div class="rounded-xl overflow-hidden border border-border-hairline h-48 relative shadow-sm group cursor-pointer">
<img alt="Map Preview" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" data-alt="A clean, minimalist digital map interface showing a route line between two points in San Francisco. The map style is light mode, utilizing soft blues and whites, with a clear blue path line indicating the journey. High-tech, clean corporate aesthetic." data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP0PnmflsM_5ZZv7pjQWc2-4_ICflveFCp8skrBLee9Jjm6wnpdXV8UbkKDHTgieM5xVtplKk1OXLO90GejDfo_sgh9qYCbry6ByqOR6nimYsb5Ef46_gtkBt4H5DMoweskD2vwlEsGbDyf1MK9ddHZaQi_vNWCLIi3KzL62i_Xr-bbmkC9ednHisNh1xoDdxvyOAe6s7knBJ12UgDbe4YpMZP4iRvbA8PIFo5SB1PG36svdNu2jQ">
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 via-transparent to-transparent"></div>
<div class="absolute bottom-md left-md right-md flex justify-between items-end">
<div class="glass-panel px-3 py-1.5 rounded-lg flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">route</span>
<span class="font-title-md text-title-md text-on-surface">Preview Route</span>
</div>
<div class="glass-panel w-8 h-8 rounded-full flex items-center justify-center hover:bg-surface-container-lowest transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">open_in_full</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-sm flex justify-end pb-lg">
<button class="hover:bg-surface-tint h-12 px-6 rounded-lg font-title-md text-title-md flex items-center gap-2 shadow-sm transition-all active:scale-95 group focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary w-full md:w-auto justify-center bg-primary-container text-on-primary-container">
                Next Step
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</main>
<!-- Suppressed BottomNavBar due to transactional flow intent -->


</body></html>
