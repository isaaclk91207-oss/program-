<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-canvas min-h-screen text-on-surface font-body-base pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b border-border-hairline dark:border-outline-variant shadow-sm z-40">
<div class="flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full">
<button class="text-on-surface-variant hover:bg-surface-container transition-colors p-2 rounded-full active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="text-headline-md font-headline-md font-bold text-primary dark:text-inverse-primary text-center flex-1">
                PCCP Vector
            </div>
<button class="hover:bg-surface-container transition-colors rounded-full overflow-hidden w-8 h-8 flex items-center justify-center bg-surface-variant active:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="person">person</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-screen-md mx-auto px-margin-mobile md:px-margin-desktop py-lg md:py-2xl pt-6">
<!-- Header -->
<div class="mb-lg flex items-center justify-between">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Notifications</h1>
<button class="font-body-sm text-body-sm text-role-passenger hover:underline">Mark all as read</button>
</div>
<!-- Notification List -->
<div class="space-y-sm">
<!-- Item 1: Unread Request Submitted -->
<button class="w-full text-left bg-surface rounded-xl p-base border border-border-hairline shadow-[0_1px_3px_rgba(15,23,42,0.05)] hover:bg-surface-container-low transition-colors relative flex gap-md items-start group active:scale-[0.99] transition-transform">
<div class="absolute top-base right-base w-3 h-3 rounded-full bg-role-passenger"></div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="pending_actions">pending_actions</span>
</div>
<div class="flex-1 pr-6">
<p class="font-title-md text-title-md text-on-surface mb-xs">Request Submitted</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm">Your trip request for Tomorrow, 8:00 AM has been received and is pending approval.</p>
<p class="font-label-caps text-label-caps text-outline">Just now</p>
</div>
</button>
<!-- Item 2: Unread Request Approved -->
<button class="w-full text-left bg-surface rounded-xl p-base border border-border-hairline shadow-[0_1px_3px_rgba(15,23,42,0.05)] hover:bg-surface-container-low transition-colors relative flex gap-md items-start group active:scale-[0.99] transition-transform">
<div class="absolute top-base right-base w-3 h-3 rounded-full bg-role-passenger"></div>
<div class="w-10 h-10 rounded-full bg-[#E0F2FE] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-role-passenger" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
<div class="flex-1 pr-6">
<p class="font-title-md text-title-md text-on-surface mb-xs">Request Approved</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm">Your trip request for Today, 2:00 PM has been approved by admin.</p>
<p class="font-label-caps text-label-caps text-outline">2 hours ago</p>
</div>
</button>
<!-- Item 3: Read Driver Assigned -->
<button class="w-full text-left bg-surface rounded-xl p-base border border-border-hairline shadow-[0_1px_3px_rgba(15,23,42,0.05)] hover:bg-surface-container-low transition-colors flex gap-md items-start group active:scale-[0.99] transition-transform">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="person_add">person_add</span>
</div>
<div class="flex-1 pr-6">
<p class="font-title-md text-title-md text-on-surface mb-xs opacity-70">Driver Assigned</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm opacity-70">Driver John D. has been assigned to your upcoming trip.</p>
<p class="font-label-caps text-label-caps text-outline">Yesterday</p>
</div>
</button>
<!-- Item 4: Read Trip Reminder -->
<button class="w-full text-left bg-surface rounded-xl p-base border border-border-hairline shadow-[0_1px_3px_rgba(15,23,42,0.05)] hover:bg-surface-container-low transition-colors flex gap-md items-start group active:scale-[0.99] transition-transform">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="event">event</span>
</div>
<div class="flex-1 pr-6">
<p class="font-title-md text-title-md text-on-surface mb-xs opacity-70">Trip Reminder</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm opacity-70">Upcoming trip in 1 hour. Driver is en route.</p>
<p class="font-label-caps text-label-caps text-outline">Yesterday</p>
</div>
</button>
<!-- Item 5: Read Trip Completed -->
<button class="w-full text-left bg-surface rounded-xl p-base border border-border-hairline shadow-[0_1px_3px_rgba(15,23,42,0.05)] hover:bg-surface-container-low transition-colors flex gap-md items-start group active:scale-[0.99] transition-transform">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="flag">flag</span>
</div>
<div class="flex-1 pr-6">
<p class="font-title-md text-title-md text-on-surface mb-xs opacity-70">Trip Completed</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm opacity-70">Your trip to Central Station has concluded.</p>
<p class="font-label-caps text-label-caps text-outline">Oct 24</p>
</div>
</button>
<!-- Item 6: Read Feedback Reminder -->
<button class="w-full text-left bg-surface rounded-xl p-base border border-border-hairline shadow-[0_1px_3px_rgba(15,23,42,0.05)] hover:bg-surface-container-low transition-colors flex gap-md items-start group active:scale-[0.99] transition-transform">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="rate_review">rate_review</span>
</div>
<div class="flex-1 pr-6">
<p class="font-title-md text-title-md text-on-surface mb-xs opacity-70">Feedback Reminder</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm opacity-70">How was your recent trip? Leave a review for John D.</p>
<p class="font-label-caps text-label-caps text-outline">Oct 24</p>
</div>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 bg-surface dark:bg-surface-dim border-t border-border-hairline z-50 rounded-t-xl shadow-[0_-1px_3px_rgba(15,23,42,0.05)] pb-safe">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-role-passenger dark:hover:text-role-passenger transition-colors w-16 h-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-role-passenger dark:hover:text-role-passenger transition-colors w-16 h-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="pending_actions">pending_actions</span>
<span class="font-label-caps text-label-caps">Requests</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-role-passenger dark:hover:text-role-passenger transition-colors w-16 h-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="route">route</span>
<span class="font-label-caps text-label-caps">Trips</span>
</button>
<button class="flex flex-col items-center justify-center text-role-passenger font-bold bg-surface-container dark:bg-surface-container-high rounded-xl px-3 py-1 my-auto h-14 w-16 active:scale-95 transition-transform duration-150 relative">
<div class="absolute top-1 right-2 w-2 h-2 rounded-full bg-error"></div>
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="notifications" data-weight="fill">notifications</span>
<span class="font-label-caps text-label-caps">Notifications</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-role-passenger dark:hover:text-role-passenger transition-colors w-16 h-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Account</span>
</button>
</nav>
<!-- Desktop SideNav Placeholder for context, hidden on mobile -->
<aside class="hidden md:flex flex-col fixed left-0 top-16 w-64 h-[calc(100vh-4rem)] bg-surface border-r border-border-hairline p-4 space-y-2">
<button class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors w-full text-left">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-title-md text-title-md">Home</span>
</button>
<button class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors w-full text-left">
<span class="material-symbols-outlined" data-icon="pending_actions">pending_actions</span>
<span class="font-title-md text-title-md">Requests</span>
</button>
<button class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors w-full text-left">
<span class="material-symbols-outlined" data-icon="route">route</span>
<span class="font-title-md text-title-md">Trips</span>
</button>
<button class="flex items-center gap-3 px-4 py-3 rounded-lg bg-surface-container text-role-passenger w-full text-left relative">
<div class="absolute top-4 right-4 w-2 h-2 rounded-full bg-error"></div>
<span class="material-symbols-outlined" data-icon="notifications" data-weight="fill">notifications</span>
<span class="font-title-md text-title-md font-bold">Notifications</span>
</button>
<button class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors w-full text-left">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-title-md text-title-md">Account</span>
</button>
</aside>
<!-- End Desktop SideNav -->
</body></html>
