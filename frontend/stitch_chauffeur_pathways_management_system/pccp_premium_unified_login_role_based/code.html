<style>
        .role-card {
            transition: all 0.3s ease;
        }
        .role-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15,23,42,0.1);
        }
        .role-card.active-driver {
            border-color: #7C3AED;
            box-shadow: 0 0 0 1px #7C3AED, 0 4px 20px rgba(124,58,237,0.15);
        }
        .role-card.active-passenger {
            border-color: #2563EB;
            box-shadow: 0 0 0 1px #2563EB, 0 4px 20px rgba(37,99,235,0.15);
        }
        .role-card.active-admin {
            border-color: #059669;
            box-shadow: 0 0 0 1px #059669, 0 4px 20px rgba(5,150,105,0.15);
        }
        
        .bg-gradient-radial {
            background-image: radial-gradient(circle at center, var(--tw-gradient-stops));
        }
    </style>
</head>
<body class="bg-surface-canvas min-h-screen flex flex-col items-center justify-center p-4 md:p-8 font-body-base text-on-surface">
<!-- Ambient Background Effect -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-gradient-radial from-primary-fixed-dim/20 to-transparent blur-3xl opacity-50 rounded-full"></div>
<div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] bg-gradient-radial from-surface-variant/30 to-transparent blur-3xl opacity-50 rounded-full"></div>
</div>
<!-- Main Container -->
<div class="w-full max-w-[1000px] z-10 flex flex-col items-center">
<!-- Header / Logo -->
<div class="text-center mb-10 flex flex-col items-center">
<img alt="PCCP Logo" class="h-20 mb-4 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOqAvWL2VueRfURCWFsFH0A6ivByY7SvGEU4fmB_HHjDiZVmKZy3DxVB1mpMmvgCEEbSL0DBcoxlim_CgX91ljmgRuv6tZdNdsyin_MUW_mPcTM-3hRX--KjYPLtygd-0Cpv2cl2NhlR7qbOJ4sifke3oj1dT4m4GLv9kK-vbSIw0ipbIaDQzyQRrHofIAsKZHr-2L0uwCZ0dAq1sHN44CazZaA8ACPTO18JdV1ob7AB7oRAdkkKpeYJEgQmwWVxFu"/>
<h1 class="text-headline-md font-headline-md text-on-surface mb-2">Welcome to PCCP</h1>
<p class="text-body-base font-body-base text-on-surface-variant">Professional Chauffeur &amp; Transport Platform</p>
</div>
<div class="w-full text-center mb-6">
<h2 class="text-title-md font-title-md text-on-surface">Select how you want to access the platform</h2>
</div>
<!-- Role Selection Cards -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full mb-12">
<!-- Driver Card -->
<button class="role-card active-driver bg-white border border-border-hairline rounded-xl p-6 text-left flex flex-col h-full relative overflow-hidden group focus:outline-none" id="card-driver" onclick="selectRole('driver')">
<div class="absolute top-0 right-0 w-24 h-24 bg-role-driver/5 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
<div class="w-12 h-12 rounded-lg bg-role-driver/10 text-role-driver flex items-center justify-center mb-4 z-10">
<span class="material-symbols-outlined text-[24px]">directions_car</span>
</div>
<h3 class="text-title-lg font-title-lg text-on-surface mb-2 z-10">Driver</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant z-10 flex-grow">Manage your trips, driving activity, performance and assessment.</p>
</button>
<!-- Passenger Card -->
<button class="role-card bg-white border border-border-hairline rounded-xl p-6 text-left flex flex-col h-full relative overflow-hidden group focus:outline-none" id="card-passenger" onclick="selectRole('passenger')">
<div class="absolute top-0 right-0 w-24 h-24 bg-role-passenger/5 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
<div class="w-12 h-12 rounded-lg bg-role-passenger/10 text-role-passenger flex items-center justify-center mb-4 z-10">
<span class="material-symbols-outlined text-[24px]">route</span>
</div>
<h3 class="text-title-lg font-title-lg text-on-surface mb-2 z-10">Passenger</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant z-10 flex-grow">Request transport, track your trip and manage your travel.</p>
</button>
<!-- Admin Card -->
<button class="role-card bg-white border border-border-hairline rounded-xl p-6 text-left flex flex-col h-full relative overflow-hidden group focus:outline-none" id="card-admin" onclick="selectRole('admin')">
<div class="absolute top-0 right-0 w-24 h-24 bg-role-admin/5 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
<div class="w-12 h-12 rounded-lg bg-role-admin/10 text-role-admin flex items-center justify-center mb-4 z-10">
<span class="material-symbols-outlined text-[24px]">dashboard</span>
</div>
<h3 class="text-title-lg font-title-lg text-on-surface mb-2 z-10">Admin</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant z-10 flex-grow">Manage transport operations, drivers, vehicles and performance.</p>
</button>
</div>
<!-- Login Form Card -->
<div class="bg-white rounded-xl shadow-sm border border-border-hairline w-full max-w-[440px] p-8 relative overflow-hidden">
<!-- Dynamic Top Accent Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-role-driver transition-colors duration-300" id="form-accent"></div>
<h2 class="text-headline-md font-headline-md text-on-surface mb-6 text-center" id="form-title">Sign in as Driver</h2>
<form action="#" class="space-y-5" method="POST">
<div>
<label class="block text-body-sm font-body-sm font-medium text-on-surface mb-1" for="identifier">Email or Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-canvas focus:bg-white focus:ring-1 focus:outline-none transition-colors duration-200 text-body-base font-body-base text-on-surface placeholder-outline" id="identifier" placeholder="Enter your ID" type="text"/>
</div>
</div>
<div>
<label class="block text-body-sm font-body-sm font-medium text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-canvas focus:bg-white focus:ring-1 focus:outline-none transition-colors duration-200 text-body-base font-body-base text-on-surface placeholder-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-sm font-body-sm text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<a class="text-body-sm font-body-sm text-primary hover:text-primary-container font-medium transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg text-title-md font-title-md text-white bg-role-driver hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 transition-all duration-300 shadow-sm mt-4" id="submit-btn" type="submit">
                    Sign In
                </button>
</form>
<div class="mt-6 text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                    Need help? <a class="text-primary hover:underline font-medium" href="#">Contact Transport Support</a>
</p>
</div>
</div>
</div>
<script>
        const roles = {
            driver: {
                title: 'Sign in as Driver',
                colorClass: 'bg-role-driver',
                ringClass: 'focus:ring-role-driver focus:border-role-driver',
                activeClass: 'active-driver',
                colorHex: '#7C3AED'
            },
            passenger: {
                title: 'Sign in as Passenger',
                colorClass: 'bg-role-passenger',
                ringClass: 'focus:ring-role-passenger focus:border-role-passenger',
                activeClass: 'active-passenger',
                colorHex: '#2563EB'
            },
            admin: {
                title: 'Sign in as Admin',
                colorClass: 'bg-role-admin',
                ringClass: 'focus:ring-role-admin focus:border-role-admin',
                activeClass: 'active-admin',
                colorHex: '#059669'
            }
        };

        let currentRole = 'driver';

        function selectRole(role) {
            if (role === currentRole) return;
            
            // Remove active classes from all cards
            document.getElementById('card-driver').classList.remove('active-driver');
            document.getElementById('card-passenger').classList.remove('active-passenger');
            document.getElementById('card-admin').classList.remove('active-admin');
            
            // Remove previous input ring classes
            const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
            inputs.forEach(input => {
                input.classList.remove(roles[currentRole].ringClass.split(' ')[0], roles[currentRole].ringClass.split(' ')[1]);
            });

            // Update state
            currentRole = role;
            const roleData = roles[role];

            // Add active class to selected card
            document.getElementById(`card-${role}`).classList.add(roleData.activeClass);

            // Update Form Title
            document.getElementById('form-title').textContent = roleData.title;

            // Update Accent Line
            const accent = document.getElementById('form-accent');
            accent.className = `absolute top-0 left-0 w-full h-1 transition-colors duration-300 ${roleData.colorClass}`;

            // Update Submit Button
            const btn = document.getElementById('submit-btn');
            btn.className = `w-full flex justify-center py-3 px-4 border border-transparent rounded-lg text-title-md font-title-md text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 transition-all duration-300 shadow-sm mt-4 ${roleData.colorClass}`;

            // Update Input Focus Rings
            inputs.forEach(input => {
                const newRings = roleData.ringClass.split(' ');
                input.classList.add(...newRings);
            });
        }
        
        // Initialize focus rings on load
        window.onload = () => {
            const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
            inputs.forEach(input => {
                const newRings = roles[currentRole].ringClass.split(' ');
                input.classList.add(...newRings);
            });
        };
    </script>
</body></html>
