<body class="bg-surface-canvas text-on-surface min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Login Container -->
<main class="w-full max-w-[440px] bg-white rounded-xl border border-border-hairline shadow-[0px_1px_3px_0px_rgba(15,23,42,0.05)] overflow-hidden transition-all duration-300">
<!-- Header Section -->
<div class="px-8 pt-8 pb-6 text-center">
<img alt="PCCP Transportation Logo" class="h-20 mx-auto mb-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrkwCyKKQ2qBZG95lwEoYRfQfPYm4m5PnmLSWJjquD1VUw3czn7L0W61Ay9ak18l3Co7V6xUsSKgq8KSKjEpuS76bhEOAryDDCShRyfLzheeq9ygQ1ANDc6rInPyADpYDf_DgLjvtBP23CLBIu-g3XYBdSty4qAmH-z_V0ehR9L2zn1Xetq3KlgjTvMVWcB2JfxBT6WcgubxgMpCIqboF3jerFq2M8pqstd18yZBhvTh_CRHxsxNwuBwagL2upzB2o"/>
<h1 class="text-headline-md font-headline-md text-on-surface mb-2">PCCP Transport</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">Corporate Chauffeur Transportation Management System</p>
</div>
<!-- Login Form -->
<div class="px-8 pb-8">
<form class="space-y-5" id="loginForm" onsubmit="event.preventDefault();">
<!-- Username / ID Field -->
<div class="space-y-1.5">
<label class="block text-label-caps font-label-caps text-on-surface-variant uppercase" for="userId" id="userLabel">User ID / Staff ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" id="userIcon">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-canvas text-body-base font-body-base text-on-surface placeholder:text-outline focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-colors focus:ring-primary" id="userId" name="userId" placeholder="Enter your ID" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block text-label-caps font-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-outline-variant rounded-lg bg-surface-canvas text-body-base font-body-base text-on-surface placeholder:text-outline focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-colors focus:ring-primary" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility_off</span>
</button>
</div>
<!-- Inline Error (Hidden by default) -->
<p class="text-body-sm font-body-sm text-error hidden" id="errorMessage">User ID or password is incorrect.</p>
</div>
<!-- Options -->
<div class="flex items-center justify-between pt-2 pb-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary-container bg-surface-canvas" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-sm font-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-body-sm font-body-sm">
<a class="text-primary hover:text-primary-container transition-colors font-medium hover:underline" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<a class="w-full h-[48px] flex items-center justify-center gap-2 rounded-lg text-white text-title-md font-title-md hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm bg-primary" href="#" id="submitBtn" onclick="const role = document.getElementById('prototypeRole').value; if(role === 'driver') { window.location.href = '{{DATA:SCREEN:SCREEN_45}}'; } else if(role === 'passenger') { window.location.href = '{{DATA:SCREEN:SCREEN_86}}'; } else { window.location.href = '#'; }">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</a>
<!-- Role Handling (Prototype Mode) -->
<div class="pt-6 border-t border-border-hairline mt-6">
<label class="block text-label-caps font-label-caps text-on-surface-variant uppercase mb-2 text-center" for="prototypeRole">Prototype Route Selection</label>
<select class="block w-full py-2 pl-3 pr-10 border border-outline-variant rounded-md bg-surface-canvas text-body-sm font-body-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="prototypeRole">
<option value="passenger">Passenger</option>
<option value="driver">Driver</option>
<option value="admin">Admin</option>
</select>
</div>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');

            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
            });
        });
    </script>
</body></html>
