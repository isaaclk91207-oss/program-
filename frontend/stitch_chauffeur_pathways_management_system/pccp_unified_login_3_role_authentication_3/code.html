<body class="bg-surface-canvas text-on-surface min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Login Container -->
<main class="w-full max-w-[440px] bg-white rounded-xl border border-border-hairline shadow-[0px_1px_3px_0px_rgba(15,23,42,0.05)] overflow-hidden transition-all duration-300">
<!-- Header Section -->
<div class="px-8 pt-8 pb-6 text-center">
<img alt="PCCP Transportation Logo" class="h-20 mx-auto mb-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0PN7J1MFhjPbSlcb716d8oTqHezNP5orc4hEsJNpnPwHXo7s5N_LyxAseC7oFq66N2qH1EZL2oWTp9qGXo-YQruuS0127Qf5iwy_xjekq6yTWo7hl5K1fs7IXu_kraQiuAbyLQRxcHXxdE_d5Sz3yCJ-94oavMvxuziR6TGS5QyUPOWKkIhAlFtpnUtJcKAaU5suXQhHll3N-NAUN41Z44YvTIfUFpFru6hmwAnO2DodIu11OdbBL0y4M3FjxSC_7">
<h1 class="text-display-lg font-display-lg text-primary mb-2">PCCP</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">Corporate Chauffeur Transportation Management System</p>
</div>
<!-- Role Selector (Segmented Control) -->
<div class="px-8 mb-6">
<div class="flex p-1 bg-surface-container-low rounded-lg border border-border-hairline/50"><button class="role-tab flex-1 py-2 text-center text-body-sm hover:text-on-surface rounded-md transition-all bg-white text-on-surface font-title-md shadow-[0px_1px_2px_rgba(0,0,0,0.05)] cursor-default" data-role="passenger" type="button">Passenger</button><button class="role-tab flex-1 py-2 text-center text-body-sm font-body-sm text-on-surface-variant hover:text-on-surface rounded-md transition-all cursor-pointer" data-role="driver" type="button">Driver</button><button class="role-tab flex-1 py-2 text-center text-body-sm font-body-sm text-on-surface-variant hover:text-on-surface rounded-md transition-all cursor-pointer" data-role="admin" type="button">Admin</button></div>
</div>
<!-- Login Form -->
<div class="px-8 pb-8">
<!-- Error States (Hidden by default) -->
<div class="hidden mb-4 p-3 bg-error-container text-on-error-container text-body-sm rounded-lg flex items-center gap-2" id="error-message-1">
<span class="material-symbols-outlined text-[18px]">error</span>
<span class="">Incorrect User ID or password</span>
</div>
<div class="hidden mb-4 p-3 bg-error-container text-on-error-container text-body-sm rounded-lg flex items-center gap-2" id="error-message-2">
<span class="material-symbols-outlined text-[18px]">block</span>
<span class="">Your account is inactive.</span>
</div>
<form class="space-y-5" id="loginForm" onsubmit="event.preventDefault();">
<!-- Username / ID Field -->
<div class="space-y-1.5">
<label class="block text-label-caps font-label-caps text-on-surface-variant uppercase" for="userId" id="userLabel">User ID / Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" id="userIcon">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-canvas text-body-base font-body-base text-on-surface placeholder:text-outline focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-colors custom-focus-ring focus:ring-role-passenger focus:ring-primary-container" id="userId" name="userId" placeholder="Enter your ID" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block text-label-caps font-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-outline-variant rounded-lg bg-surface-canvas text-body-base font-body-base text-on-surface placeholder:text-outline focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-colors custom-focus-ring focus:ring-role-passenger focus:ring-primary-container" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" onclick="const p = document.getElementById('password'); const i = this.querySelector('span'); if(p.type === 'password') { p.type = 'text'; i.textContent = 'visibility_off'; } else { p.type = 'password'; i.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between pt-2 pb-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary-container bg-surface-canvas" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block text-body-sm font-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-body-sm font-body-sm">
<a class="text-primary hover:text-primary-container transition-colors font-medium hover:underline" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] flex items-center justify-center gap-2 rounded-lg text-white text-title-md font-title-md hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-role-admin-container shadow-sm bg-role-passenger bg-primary-container" id="submitBtn" onclick="handleLogin(event)" type="submit">
<span id="btnText" class="">Sign In</span>
<span class="material-symbols-outlined text-[20px]" id="btnIcon">arrow_forward</span>
<svg class="hidden animate-spin h-5 w-5 text-white" fill="none" id="btnLoader" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path></svg>
</button>
</form>
</div>
</main>
<script>
        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            
            // Simulation logic
            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnIcon.classList.add('hidden');
            btnLoader.classList.remove('hidden');

            const role = document.querySelector('.role-tab.bg-white').dataset.role;
            
            setTimeout(() => {
                if(role === 'driver') { window.location.href = '{{DATA:SCREEN:SCREEN_18}}'; } 
                else if(role === 'passenger') { window.location.href = '{{DATA:SCREEN:SCREEN_59}}'; } 
                else { window.location.href = '#'; }
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.role-tab');
            const submitBtn = document.getElementById('submitBtn');
            const userLabel = document.getElementById('userLabel');
            const userIcon = document.getElementById('userIcon');
            const inputs = document.querySelectorAll('.custom-focus-ring');

            // Define role-specific configuration based on Style Guidance
            const roleConfig = {
                admin: {
                    buttonBg: 'bg-role-admin',
                    focusRing: 'focus:ring-role-admin',
                    label: 'User ID / Employee ID',
                    icon: 'admin_panel_settings'
                },
                passenger: {
                    buttonBg: 'bg-role-passenger',
                    focusRing: 'focus:ring-role-passenger',
                    label: 'User ID / Employee ID',
                    icon: 'person'
                },
                driver: {
                    buttonBg: 'bg-role-driver',
                    focusRing: 'focus:ring-role-driver',
                    label: 'User ID / Employee ID',
                    icon: 'directions_car'
                }
            };

            // Set initial state based on default active tab
            let currentRole = 'driver';
            updateInputsFocus(roleConfig[currentRole].focusRing);

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const selectedRole = tab.dataset.role;
                    if (selectedRole === currentRole) return;

                    // 1. Reset all tabs to inactive state
                    tabs.forEach(t => {
                        t.classList.remove('bg-white', 'text-on-surface', 'font-title-md', 'shadow-[0px_1px_2px_rgba(0,0,0,0.05)]', 'cursor-default');
                        t.classList.add('text-on-surface-variant', 'font-body-sm', 'cursor-pointer');
                    });

                    // 2. Set clicked tab to active state
                    tab.classList.add('bg-white', 'text-on-surface', 'font-title-md', 'shadow-[0px_1px_2px_rgba(0,0,0,0.05)]', 'cursor-default');
                    tab.classList.remove('text-on-surface-variant', 'font-body-sm', 'cursor-pointer');

                    // 3. Update Form Elements based on Role
                    const config = roleConfig[selectedRole];
                    
                    // Update Button Color
                    submitBtn.classList.remove(roleConfig[currentRole].buttonBg);
                    submitBtn.classList.add(config.buttonBg);

                    // Update Focus Rings
                    inputs.forEach(input => {
                        input.classList.remove(roleConfig[currentRole].focusRing);
                        input.classList.add(config.focusRing);
                    });

                    // Update Labels and Icons for contextual clarity
                    userLabel.textContent = config.label;
                    userIcon.textContent = config.icon;

                    currentRole = selectedRole;
                });
            });

            function updateInputsFocus(newRingClass) {
                inputs.forEach(input => {
                    // Remove any existing specific focus rings (cleanup utility)
                    input.classList.forEach(className => {
                        if(className.startsWith('focus:ring-role-')) {
                            input.classList.remove(className);
                        }
                    });
                    input.classList.add(newRingClass);
                });
            }
        });
    </script>
