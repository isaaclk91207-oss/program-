            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-canvas text-on-surface min-h-screen flex flex-col font-body-base">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b border-border-hairline dark:border-outline-variant shadow-sm z-50">
<div class="flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors active:opacity-80 transition-opacity p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="text-headline-md font-headline-md font-bold text-primary dark:text-inverse-primary">
                Review Request
            </div>
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden border border-border-hairline flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a corporate employee in a brightly lit modern office setting. The individual is smiling gently, wearing business casual attire. The background is slightly blurred showing modern architectural elements and natural light, reflecting a clean, corporate light-mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzX-oSKK0D8Aog2o-JRkzHKVlDGHOnA3Qx4x2f5wOPJgtwDwvkUYXY9XSK0Fg4Mf-Ke18vlSf5-jVPmtSRWkIusRpoFUGsAitBZi0b4nQN5c46_XdZ472uadKXeV3Wrfr5A8wfhQXeH6k-GhZ6OlsjK5sa5K4MG4I70JpPwFIi6GTtv49M4z5AW1hpT_0TYZpUnm0TXMt7FejY2SecBFWU5e-zBSz17Ld1zVHQSe7g5WNbpsL4ct4"/>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex justify-center py-8 px-margin-mobile md:px-margin-desktop">
<div class="w-full max-w-[600px] flex flex-col gap-6">
<!-- Summary Card -->
<div class="bg-surface rounded-xl shadow-[0_1px_3px_rgba(15,23,42,0.05)] border border-border-hairline overflow-hidden">
<div class="p-6 border-b border-border-hairline flex items-center gap-4 bg-surface-container-low">
<div class="w-12 h-12 rounded-full bg-role-passenger bg-opacity-10 text-role-passenger flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
</div>
<div>
<h2 class="font-title-lg text-title-lg text-on-surface">18 Aug 2026</h2>
<p class="font-body-sm text-body-sm text-outline">Customer Appointment</p>
</div>
<div class="ml-auto bg-role-passenger text-on-primary px-3 py-1 rounded-full font-label-caps text-label-caps uppercase">
                        Round Trip
                    </div>
</div>
<div class="p-6 flex flex-col gap-5">
<!-- Passengers & Dept -->
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-outline uppercase">Requester</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]" data-icon="person">person</span>
<span class="font-title-md text-title-md text-on-surface">Hsu Yadanar</span>
</div>
</div>
<div class="flex flex-col gap-1 items-end">
<span class="font-label-caps text-label-caps text-outline uppercase">Department</span>
<span class="font-body-base text-body-base text-on-surface">SME</span>
</div>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]" data-icon="group">group</span>
<span class="font-body-base text-body-base text-on-surface">2 Passengers</span>
</div>
<hr class="border-border-hairline"/>
<!-- Route -->
<div class="relative flex flex-col gap-4 pl-4 border-l-2 border-border-hairline ml-2">
<!-- Origin -->
<div class="relative">
<div class="absolute -left-[23px] top-1 w-3 h-3 rounded-full bg-surface border-2 border-outline z-10"></div>
<span class="font-label-caps text-label-caps text-outline uppercase block mb-1">Pickup - 09:00 AM</span>
<span class="font-title-md text-title-md text-on-surface block">uab HO</span>
</div>
<!-- Destination -->
<div class="relative">
<div class="absolute -left-[23px] top-1 w-3 h-3 rounded-full bg-role-passenger z-10"></div>
<span class="font-label-caps text-label-caps text-outline uppercase block mb-1">Return - 05:00 PM</span>
<span class="font-title-md text-title-md text-on-surface block">Sule Square</span>
</div>
</div>
</div>
</div>
<!-- Notes Section -->
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1">Note to Transport</label>
<textarea class="w-full bg-surface rounded-lg border border-border-hairline p-3 min-h-[100px] font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-role-passenger focus:border-transparent resize-none placeholder-outline" placeholder="Add any special instructions for the transport team..."></textarea>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1">Note for Driver</label>
<textarea class="w-full bg-surface rounded-lg border border-border-hairline p-3 min-h-[100px] font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-role-passenger focus:border-transparent resize-none placeholder-outline" placeholder="Instructions specifically for the driver (e.g., parking, contact info)..."></textarea>
</div>
</div>
<!-- Actions -->
<div class="pt-4 pb-8 flex flex-col gap-3">
<button class="w-full h-12 bg-role-passenger text-on-primary rounded-lg font-title-md text-title-md flex items-center justify-center gap-2 hover:bg-opacity-90 transition-colors active:scale-[0.98] shadow-sm">
                    Submit Transport Request
                    <span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</div>
</main>
</body></html>
