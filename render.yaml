services:
  - type: web
    name: pccp-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: yarn prisma generate && yarn tsc
    startCommand: yarn prisma db push --skip-generate && node dist/app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: CORS_ORIGIN
        value: https://pccp-program.vercel.app,https://pccp-program-isaaclk91207-oss-projects.vercel.app
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: WIALON_BASE_URL
        value: https://s7.netprogps.net
      - key: CRON_SCHEDULE
        value: 0 */6 * * *
      - key: JWT_SECRET
        sync: false
      - key: WIALON_TOKEN
        sync: false